name: The Money Machine Trading Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  trade:
    runs-on: windows-latest
    steps:
      - name: Force-Kill Ghost Processes
        shell: cmd
        continue-on-error: true
        run: taskkill /F /IM terminal64.exe /T /FI "STATUS eq RUNNING" 2>nul & taskkill /F /IM setup.exe /T /FI "STATUS eq RUNNING" 2>nul & exit 0

      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Verified 64-bit MT5
        shell: powershell
        run: |
          $dir = "D:\a\Broker\Broker\mt5_terminal"
          if (!(Test-Path $dir)) { New-Item -ItemType Directory -Force -Path $dir }
          # Use the direct Exness 64-bit link
          $url = "https://download.mql5.com/cdn/web/exness.technologies.ltd/mt5/exness5setup.exe"
          Invoke-WebRequest -Uri $url -OutFile "$dir\setup.exe"
          # Extract the terminal64.exe specifically from the setup
          Start-Process -FilePath "$dir\setup.exe" -ArgumentList "/auto", "/quit", "/portable", "/path:$dir" -Wait
          # Verify file size (should be > 10MB)
          if (Test-Path "$dir\terminal64.exe") {
            $file = Get-Item "$dir\terminal64.exe"
            if ($file.Length -lt 1000000) { throw "File is too small/corrupted!" }
            Write-Host "Verified 64-bit Terminal Found: $($file.Length) bytes"
          } else {
            throw "terminal64.exe not found after extraction!"
          }

      - name: Inject Exness Server Data
        shell: powershell
        run: |
          $configDir = Join-Path $env:GITHUB_WORKSPACE "mt5_terminal\config"
          if (!(Test-Path $configDir)) { New-Item -ItemType Directory -Force -Path $configDir }
          $content = @(
            "[Common]",
            "Login=${{ secrets.MT5_LOGIN }}",
            "Password=${{ secrets.MT5_PASSWORD }}",
            "Server=${{ secrets.MT5_SERVER }}",
            "ProxyEnable=0",
            "CertConfirm=1",
            "NewsEnable=0"
          )
          $content | Out-File -FilePath (Join-Path $configDir "common.ini") -Encoding ascii
          Write-Host "Exness server and account data injected."

      - name: Setup Headless Display
        uses: pyvista/setup-headless-display-action@v3

      - name: Setup Virtual Monitor
        shell: powershell
        run: |
          pip install PyVirtualDisplay
          Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Run Trading Bot
        shell: cmd
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: python main.py

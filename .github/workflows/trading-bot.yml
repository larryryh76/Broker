name: Autonomous MT5 Trading Cycle (Native Windows)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  trading-cycle:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r trading_bot/requirements.txt
          pip install MetaTrader5 psutil

      - name: Setup MT5 and Pre-seed Config
        id: setup
        shell: powershell
        run: |
          $installPath = "C:\mt5_terminal"
          $dataPath = "C:\mt5_terminal\data"

          # 1. Download and Install MT5
          $setupUrl = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          $setupPath = "$env:TEMP\mt5setup.exe"

          echo "Downloading MT5 Installer..."
          Invoke-WebRequest -Uri $setupUrl -OutFile $setupPath

          echo "Installing MT5 Terminal..."
          Start-Process -FilePath $setupPath -ArgumentList "/auto", "/path:$installPath" -Wait
          Start-Sleep -Seconds 10

          # 2. Discover Executable
          $mt5Path = Get-ChildItem -Path "C:\" -Filter "terminal64.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $mt5Path) { $mt5Path = "$installPath\terminal64.exe" }
          Unblock-File -Path $mt5Path
          echo "MT5_EXE=$mt5Path" >> $env:GITHUB_ENV
          echo "MT5_DIR=$(Split-Path $mt5Path)" >> $env:GITHUB_ENV
          echo "MT5_DATA=$dataPath" >> $env:GITHUB_ENV

          # 3. Create Controlled Data Directory Structure
          echo "Pre-seeding Terminal Configuration..."
          $subdirs = "config", "MQL5\Profiles", "MQL5\Logs"
          foreach ($sd in $subdirs) {
             New-Item -ItemType Directory -Force -Path "$dataPath\$sd"
          }

          $terminalIni = @"
          [Main]
          Login=$($env:MT5_LOGIN)
          Password=$($env:MT5_PASSWORD)
          Server=$($env:MT5_SERVER)
          AutoConnect=1
          [Common]
          AlgoTrading=1
          "@
          Set-Content -Path "$dataPath\config\terminal.ini" -Value $terminalIni

          # 4. Launch MT5 with Login Parameters
          echo "Launching MT5 for first-time login..."
          # Clean existing
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force

          $args = "/portable", "/datapath:$dataPath", "/skipupdate", "/login:$($env:MT5_LOGIN)", "/password:$($env:MT5_PASSWORD)", "/server:$($env:MT5_SERVER)"
          Start-Process -FilePath $mt5Path -ArgumentList $args -WorkingDirectory (Split-Path $mt5Path)

          echo "Waiting 60s for initialization and login stabilization..."
          Start-Sleep -Seconds 60

          # Verify logs are being written
          if (Test-Path "$dataPath\MQL5\Logs") {
             echo "Terminal Log directory exists."
          } else {
             echo "WARNING: Log directory not found. Terminal may not be initialized."
          }
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}

      - name: Run Trading Bot
        shell: powershell
        run: |
          $env:PYTHONPATH = "."
          python trading_bot/bot.py
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MT5_TERMINAL_PATH: ${{ env.MT5_EXE }}
          MT5_DATA_PATH: ${{ env.MT5_DATA }}

      - name: Extract Artifacts
        if: always()
        shell: powershell
        run: |
          if (!(Test-Path "artifacts")) { New-Item -ItemType Directory -Path "artifacts" }
          $mt5Data = $env:MT5_DATA
          if (Test-Path "$mt5Data\MQL5\Logs") {
             Copy-Item -Path "$mt5Data\MQL5\Logs\*" -Destination "artifacts/logs" -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path "trading_bot/logs") {
            Copy-Item -Path "trading_bot/logs/*" -Destination "artifacts/logs" -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path "trading_bot/snapshots") {
            Copy-Item -Path "trading_bot/snapshots" -Destination "artifacts/snapshots" -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trading-artifacts-${{ github.run_id }}
          path: artifacts/

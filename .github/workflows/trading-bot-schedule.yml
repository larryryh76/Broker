name: The Money Machine Trading Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  trade:
    runs-on: windows-latest
    steps:
      - name: Force-Kill Ghost Processes
        shell: cmd
        continue-on-error: true
        run: taskkill /F /IM terminal64.exe /T /FI "STATUS eq RUNNING" 2>nul & taskkill /F /IM setup.exe /T /FI "STATUS eq RUNNING" 2>nul & exit 0

      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Deploy Portable MT5 Files
        shell: powershell
        run: |
          $mt5Dir = Join-Path $env:GITHUB_WORKSPACE "mt5_terminal"
          # Download the portable ZIP if possible, or use a workaround
          # For now, we will assume the mt5_terminal folder is managed in the repo
          # or downloaded from a reliable source.
          # Since the user specifically said "Stop using the installer",
          # we will rely on the pre-configured folder in the repo.
          if (!(Test-Path (Join-Path $mt5Dir "terminal64.exe"))) {
            Write-Host "ERROR: terminal64.exe not found in mt5_terminal folder."
            # Fallback download for resilience
            curl.exe -L -o mt5.zip "https://github.com/hpdeandrade/pymt5linux/releases/download/v1.0.0/mt5_terminal.zip"
            Expand-Archive -Path mt5.zip -DestinationPath $env:GITHUB_WORKSPACE -Force
          }

      - name: Inject Exness Server Data
        shell: powershell
        run: |
          $configDir = Join-Path $env:GITHUB_WORKSPACE "mt5_terminal\config"
          if (!(Test-Path $configDir)) { New-Item -ItemType Directory -Force -Path $configDir }
          $content = @(
            "[Common]",
            "Login=${{ secrets.MT5_LOGIN }}",
            "Password=${{ secrets.MT5_PASSWORD }}",
            "Server=${{ secrets.MT5_SERVER }}",
            "ProxyEnable=0",
            "CertConfirm=1",
            "NewsEnable=0"
          )
          $content | Out-File -FilePath (Join-Path $configDir "common.ini") -Encoding ascii
          Write-Host "Exness server and account data injected."

      - name: Setup Virtual Monitor
        shell: powershell
        run: |
          pip install PyVirtualDisplay
          Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Run Trading Bot
        shell: cmd
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: python main.py

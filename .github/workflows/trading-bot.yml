name: Money Machine Trading Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  trade:
    # SECTION 2 — Windows Runner Setup
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Python
        # SECTION 1 — Upgrade Python Version (3.12)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Headless Display (Mesa3D)
        uses: pyvista/setup-headless-display-action@v3
        with:
          mesa3d-release: '24.3.0'

      # SECTION 3 — MT5 Installation Cache
      - name: Cache MT5 Terminal
        id: cache-mt5
        uses: actions/cache@v4
        with:
          path: mt5_terminal
          key: mt5-terminal-v1

      - name: Download and Install MT5 (if not cached)
        if: steps.cache-mt5.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $dir = "$env:GITHUB_WORKSPACE\mt5_terminal"
          if (!(Test-Path $dir)) { New-Item -ItemType Directory -Force -Path $dir }
          $url = "https://download.mql5.com/cdn/web/fbs.markets.inc/mt5/fbs5setup.exe"
          Invoke-WebRequest -Uri $url -OutFile "$dir\setup.exe"
          Start-Process -FilePath "$dir\setup.exe" -ArgumentList "/auto", "/quit", "/portable", "/path:$dir" -Wait
          Write-Host "MT5 Terminal installed to $dir"

      - name: Install Dependencies
        # SECTION 3 & 4 — Install From requirements.txt with Fallback
        run: |
          python -m pip install --upgrade pip
          pip install -r trading-bot/requirements.txt || pip install pandas_ta

      - name: Verify Installation
        # SECTION 5 — Verify Installation
        run: |
          python -c "import MetaTrader5; import pandas; import numpy; import pandas_ta; print('Dependencies installed successfully')"

      - name: Run Trading Cycle
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          cd trading-bot
          python bot.py

      # SECTION 8 — Logging (Artifacts)
      - name: Upload Logs and Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cycle-artifacts-${{ github.run_id }}
          path: |
            trading-bot/logs/
            trading-bot/trades/
            trading-bot/signals/

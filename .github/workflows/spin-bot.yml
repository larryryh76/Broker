name: Omni-Recursive Money Machine Cycle (V5.15 - Immortal Session)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  run-cycle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Create Artifacts Folder
        run: mkdir -p artifacts || true

      - name: Execute Money Machine Cycle (V5.15 Predator Mode)
        run: |
          python -m spin_bot.bot
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SPIN_URL: ${{ secrets.SPIN_URL }}
          FOOTBALL_NG_LOGIN: ${{ secrets.FOOTBALL_NG_LOGIN }}
          FOOTBALL_NG_PASS: ${{ secrets.FOOTBALL_NG_PASS }}
          GOLDEN_ACCESS_TOKEN: ${{ secrets.GOLDEN_ACCESS_TOKEN }}
          GOLDEN_REFRESH_TOKEN: ${{ secrets.GOLDEN_REFRESH_TOKEN }}
          GOLDEN_PUID: ${{ secrets.GOLDEN_PUID }}
          GOLDEN_DEVICE_ID: ${{ secrets.GOLDEN_DEVICE_ID }}
          GOLDEN_CF_BM: ${{ secrets.GOLDEN_CF_BM }}
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}

      - name: Extract Artifacts (State Logs)
        if: always()
        run: |
          mkdir -p artifacts
          cp *.log artifacts/ 2>/dev/null || true

      - name: Upload Logs & Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spin-logs-v5.15-${{ github.run_id }}
          path: artifacts/

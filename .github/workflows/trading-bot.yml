name: Autonomous MT5 Trading Cycle (Native Windows)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  trading-cycle:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r trading_bot/requirements.txt
          pip install MetaTrader5 psutil

      - name: Setup MT5 and Tools
        id: setup
        shell: powershell
        run: |
          # 1. Download PsExec for interactive session management
          $pstoolsUrl = "https://download.sysinternals.com/files/PSTools.zip"
          $pstoolsPath = "$env:TEMP\PSTools.zip"
          Invoke-WebRequest -Uri $pstoolsUrl -OutFile $pstoolsPath
          Expand-Archive -Path $pstoolsPath -DestinationPath "C:\pstools" -Force

          # 2. Download and Install MT5
          $setupUrl = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          $setupPath = "$env:TEMP\mt5setup.exe"
          $installPath = "C:\mt5_terminal"

          Invoke-WebRequest -Uri $setupUrl -OutFile $setupPath
          Start-Process -FilePath $setupPath -ArgumentList "/auto", "/path:$installPath" -Wait
          Start-Sleep -Seconds 15

          # 3. Dynamic Discovery of terminal64.exe
          $mt5Path = Get-ChildItem -Path "C:\" -Filter "terminal64.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $mt5Path) {
             $mt5Path = "C:\mt5_terminal\terminal64.exe" # Last resort fallback
          }

          $mt5Dir = Split-Path $mt5Path
          echo "MT5 FOUND AT: $mt5Path"
          echo "MT5 DIR: $mt5Dir"

          # Set for GHA environment
          echo "MT5_EXE=$mt5Path" >> $env:GITHUB_ENV
          echo "MT5_DIR=$mt5Dir" >> $env:GITHUB_ENV

          # 4. Seed Config for Automatic Login
          $configDir = "$mt5Dir\config"
          if (!(Test-Path $configDir)) { New-Item -ItemType Directory -Path $configDir }
          $commonIni = @"
          [Common]
          Login=$($env:MT5_LOGIN)
          Password=$($env:MT5_PASSWORD)
          Server=$($env:MT5_SERVER)
          ProxyEnable=0
          "@
          Set-Content -Path "$configDir\common.ini" -Value $commonIni
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}

      - name: Launch MT5 (Interactive Session)
        shell: powershell
        run: |
          # 1. Activate Windows Explorer to ensure interactive session shell
          cmd /c "start explorer.exe"
          Start-Sleep -Seconds 5

          # 2. Launch MT5 attached to Session 1 via PsExec
          echo "Launching MT5 from $env:MT5_EXE in Interactive Session..."
          C:\pstools\psexec.exe /accepteula -i 1 -d "$env:MT5_EXE" /portable /skipupdate

          # 3. Stabilization and UI Handling Loop
          echo "Waiting for Terminal Initialization (Monitored)..."
          Add-Type -AssemblyName System.Windows.Forms

          for ($i=1; $i -le 12; $i++) {
            Start-Sleep -Seconds 10
            $proc = Get-Process terminal64 -ErrorAction SilentlyContinue
            if ($proc) {
              $mem = [math]::Round($proc.WorkingSet64 / 1MB, 2)
              echo "Attempt ${i}: MT5 is ALIVE (PID: $($proc.Id), Memory: ${mem} MB)"
              [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
            } else {
              echo "Attempt ${i}: MT5 missing. relaunching..."
              C:\pstools\psexec.exe /accepteula -i 1 -d "$env:MT5_EXE" /portable /skipupdate
            }
          }
          echo "Terminal stabilization sequence complete."

      - name: Run Trading Bot
        shell: powershell
        run: |
          $env:PYTHONPATH = "."
          python trading_bot/bot.py
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MT5_TERMINAL_PATH: ${{ env.MT5_EXE }}

      - name: Extract Artifacts
        if: always()
        shell: powershell
        run: |
          if (!(Test-Path "artifacts")) { New-Item -ItemType Directory -Path "artifacts" }
          # Attempt to find MQL5 Logs in portable data folder
          $mt5DataDir = "$env:MT5_DIR"
          if (Test-Path "$mt5DataDir\MQL5\Logs") {
             Copy-Item -Path "$mt5DataDir\MQL5\Logs\*" -Destination "artifacts/logs" -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path "trading_bot/logs") {
            Copy-Item -Path "trading_bot/logs/*" -Destination "artifacts/logs" -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path "trading_bot/snapshots") {
            Copy-Item -Path "trading_bot/snapshots" -Destination "artifacts/snapshots" -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trading-artifacts-${{ github.run_id }}
          path: artifacts/

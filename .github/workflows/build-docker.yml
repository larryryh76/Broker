name: Build and Push MT5 and Bot Images

on:
  workflow_dispatch:
  push:
    paths:
      - 'Dockerfile*'
      - 'start_mt5.sh'
      - 'trading-bot/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push MT5 Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.mt5
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mt5-headless:latest

      - name: Build and Push Bot Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/broker-bot:latest

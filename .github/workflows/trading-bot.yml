name: Foundation MT5 Snapshot Cycle (Docker/mt5linux)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  foundation-cycle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r trading-bot/requirements.txt
          python -m pip list

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # SECTION 12 — Manual MT5 Container Lifecycle
      - name: Start MT5 Container
        run: |
          docker run -d --name mt5 -p 8001:8001 \
            -e MT5_LOGIN="${{ secrets.MT5_LOGIN }}" \
            -e MT5_PASSWORD="${{ secrets.MT5_PASSWORD }}" \
            -e MT5_SERVER="${{ secrets.MT5_SERVER }}" \
            ghcr.io/larryryh76/mt5-headless:latest

      - name: Verify MT5 Container Status
        run: docker ps -a

      - name: Wait for Container to be Running
        run: |
          echo "Checking container health..."
          for i in {1..20}; do
            if [ "$(docker inspect -f '{{.State.Running}}' mt5)" == "true" ]; then
              echo "Container is running."
              exit 0
            fi
            echo "Waiting for container..."
            sleep 5
          done
          echo "Container failed to start."
          exit 1

      - name: Wait for MT5 Bridge
        run: |
          echo "Waiting for MT5 bridge (RPyC) to initialize..."
          for i in {1..30}; do
            if nc -z localhost 8001; then
              echo "Bridge port 8001 is open!"
              echo "Stabilizing for 60 seconds to ensure MT5 terminal is ready..."
              sleep 60
              exit 0
            fi
            echo "Waiting for bridge port..."
            sleep 10
          done
          echo "Bridge failed to start."
          exit 1

      - name: Run Foundation Cycle
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          cd trading-bot
          python bot.py

      - name: Print MT5 container logs
        if: always()
        run: docker logs mt5 || true

      - name: Ensure logs directories exist
        if: always()
        run: |
          mkdir -p trading-bot/logs
          mkdir -p trading-bot/snapshots

      - name: Upload Logs and Snapshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-artifacts-${{ github.run_id }}
          path: |
            trading-bot/logs/
            trading-bot/snapshots/

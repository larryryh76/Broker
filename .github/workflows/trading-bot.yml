name: Money Machine Continuous

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

jobs:
  trade:
    # Supports both Ghost Runner (Self-Hosted) and Standard GHA Runners
    # Note: To use Ghost Runner, ensure 'self-hosted' label is available.
    runs-on: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.inputs.runner, 'self')) && 'self-hosted' || 'windows-latest' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pure Headless Display
        uses: pyvista/setup-headless-display-action@v3
        with:
          mesa3d-release: '24.3.0'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install MetaTrader5 psutil numpy pandas pandas-ta scikit-learn python-dotenv joblib pymongo requests

      - name: Prepare MT5 Environment
        shell: powershell
        run: |
          $dir = "$env:GITHUB_WORKSPACE\mt5_terminal"
          if (!(Test-Path $dir)) { New-Item -ItemType Directory -Force -Path $dir }
          $url = "https://download.mql5.com/cdn/web/fbs.markets.inc/mt5/fbs5setup.exe"
          Invoke-WebRequest -Uri $url -OutFile "$dir\setup.exe"
          Start-Process -FilePath "$dir\setup.exe" -ArgumentList "/auto", "/quit", "/portable", "/path:$dir" -Wait

      - name: Run Trading Engine (Watchdog)
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd trading-bot
          python watchdog.py

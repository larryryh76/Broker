name: The Money Machine Trading Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  trade:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download and Deploy Portable MT5
        shell: powershell
        run: |
          $mt5Dir = Join-Path $env:GITHUB_WORKSPACE "mt5_terminal"
          # Download the installer
          curl.exe -L -o setup.exe "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          # Extract it to the terminal folder
          Start-Process -FilePath ".\setup.exe" -ArgumentList "/auto", "/quit", "/portable", "/path:$mt5Dir" -Wait
          # Check if it worked
          if (Test-Path (Join-Path $mt5Dir "terminal64.exe")) { echo "SUCCESS: Terminal found!" } else { echo "ERROR: Terminal still missing" }

      - name: Force Account Configuration
        shell: powershell
        run: |
          $configDir = Join-Path $env:GITHUB_WORKSPACE "mt5_terminal\config"
          if (!(Test-Path $configDir)) { New-Item -ItemType Directory -Force -Path $configDir }
          $iniContent = @"
[Common]
Login=${{ secrets.MT5_LOGIN }}
Password=${{ secrets.MT5_PASSWORD }}
Server=${{ secrets.MT5_SERVER }}
ProxyEnable=0
CertConfirm=1
NewsEnable=0
"@
          Set-Content -Path (Join-Path $configDir "common.ini") -Value $iniContent
          Write-Host "Forced account configuration created in $configDir"

      - name: Force-Kill Stuck Processes
        shell: cmd
        continue-on-error: true
        run: taskkill /F /IM terminal64.exe /T /FI "STATUS eq RUNNING" 2>nul || exit 0

      - name: Run Trading Bot
        shell: cmd
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: python main.py

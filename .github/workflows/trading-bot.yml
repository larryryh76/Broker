name: Autonomous MT5 Trading Cycle (Native Windows)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  trading-cycle:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r trading_bot/requirements.txt
          pip install MetaTrader5

      - name: Setup MT5 Terminal
        shell: powershell
        run: |
          $setupUrl = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          $setupPath = "$env:TEMP\mt5setup.exe"
          $installPath = "C:\mt5_terminal"
          $terminalExe = "$installPath\terminal64.exe"

          echo "Downloading MT5 Installer..."
          Invoke-WebRequest -Uri $setupUrl -OutFile $setupPath

          echo "Installing MT5 Terminal to $installPath..."
          Start-Process -FilePath $setupPath -ArgumentList "/auto", "/path:$installPath" -Wait

          if (!(Test-Path $terminalExe)) {
            echo "CRITICAL: Installation failed. terminal64.exe not found."
            exit 1
          }

          # --- CONFIGURATION SEEDING ---
          echo "Seeding MT5 Configuration..."
          $configDir = "$installPath\config"
          if (!(Test-Path $configDir)) { New-Item -ItemType Directory -Path $configDir }

          $commonIni = @"
          [Common]
          Login=$($env:MT5_LOGIN)
          Password=$($env:MT5_PASSWORD)
          Server=$($env:MT5_SERVER)
          ProxyEnable=0
          "@
          Set-Content -Path "$configDir\common.ini" -Value $commonIni

          # --- PHASE 1: INITIALIZATION ---
          echo "Starting MT5 PHASE 1: Initialization..."
          $args = "/portable", "/skipupdate"
          $proc = Start-Process -FilePath $terminalExe -ArgumentList $args -PassThru

          echo "Waiting 60s for MT5 to stabilize profile..."
          Start-Sleep -Seconds 60

          echo "Terminating MT5 Phase 1..."
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 15

          # --- PHASE 2: STABLE RUN ---
          echo "Starting MT5 PHASE 2: Stable IPC run..."
          $proc = Start-Process -FilePath $terminalExe -ArgumentList $args -PassThru

          echo "Waiting 120s for IPC bridge and LOGIN readiness..."
          for ($i=1; $i -le 12; $i++) {
            Start-Sleep -Seconds 10
            $check = Get-Process terminal64 -ErrorAction SilentlyContinue
            if ($check) {
              $mem = [math]::Round($check.WorkingSet64 / 1MB, 2)
              echo "Attempt ${i}: MT5 is ALIVE (PID: $($check.Id), Memory: $mem MB)"
            } else {
              echo "Attempt ${i}: MT5 CRASHED! Relaunching..."
              $proc = Start-Process -FilePath $terminalExe -ArgumentList $args -PassThru
            }
          }
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}

      - name: Run Trading Bot
        shell: powershell
        run: |
          $env:PYTHONPATH = "."
          python trading_bot/bot.py
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MT5_TERMINAL_PATH: 'C:\mt5_terminal\terminal64.exe'

      - name: Extract Artifacts
        if: always()
        shell: powershell
        run: |
          if (!(Test-Path "artifacts")) { New-Item -ItemType Directory -Path "artifacts" }
          if (Test-Path "trading_bot/logs") {
            Copy-Item -Path "trading_bot/logs" -Destination "artifacts/logs" -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path "trading_bot/snapshots") {
            Copy-Item -Path "trading_bot/snapshots" -Destination "artifacts/snapshots" -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trading-artifacts-${{ github.run_id }}
          path: artifacts/

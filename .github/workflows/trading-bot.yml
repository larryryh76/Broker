name: Autonomous MT5 Trading Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  trading-cycle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Start Multi-Container Services
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: docker-compose up -d --build

      - name: Monitor Trading Bot
        run: |
          echo "Following bot logs..."
          docker logs -f bot

          EXIT_CODE=$(docker inspect bot --format='{{.State.ExitCode}}')
          echo "Bot exited with code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            exit 1
          fi

      - name: Print MT5 logs on failure
        if: always()
        run: docker logs mt5 || true

      - name: Extract Artifacts
        if: always()
        run: |
          mkdir -p artifacts/logs artifacts/snapshots
          docker cp bot:/app/trading-bot/logs/ artifacts/ || true
          docker cp bot:/app/trading-bot/snapshots/ artifacts/ || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trading-artifacts-${{ github.run_id }}
          path: artifacts/

      - name: Shutdown Services
        if: always()
        run: docker-compose down

name: Money Machine Linux Container Trading Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  trade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # SECTION 10 — Persistent Wine Environment Cache
      - name: Cache Wine and MT5 Data
        id: cache-wine
        uses: actions/cache@v4
        with:
          path: |
            wine_prefix/
            mt5_terminal/
          key: wine-mt5-persistent-v2-${{ runner.os }}

      - name: Build Docker Image
        run: |
          docker build -t mt5-trading-bot .

      - name: Run Trading Cycle in Linux Container
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          # Create local directories for mounting if they don't exist
          mkdir -p wine_prefix mt5_terminal
          # Fix ownership for the container user (UID 1000 is common for non-root)
          # We use 777 to guarantee writability regardless of container UID mapping
          chmod -R 777 wine_prefix mt5_terminal

          docker run --rm \
            -e MT5_LOGIN="${MT5_LOGIN}" \
            -e MT5_PASSWORD="${MT5_PASSWORD}" \
            -e MT5_SERVER="${MT5_SERVER}" \
            -e MONGODB_URI="${MONGODB_URI}" \
            -v $(pwd)/wine_prefix:/app/.wine \
            -v $(pwd)/mt5_terminal:/app/.mt5 \
            mt5-trading-bot:latest

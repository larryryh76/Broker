name: Autonomous MT5 Trading Cycle (Native Windows)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  trading-cycle:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r trading_bot/requirements.txt
          pip install MetaTrader5

      - name: Download and Install MT5
        shell: powershell
        run: |
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          $outpath = "$PSScriptRoot\mt5setup.exe"
          Invoke-WebRequest -Uri $url -OutFile $outpath
          Start-Process -FilePath $outpath -ArgumentList "/silent" -Wait

          # Wait for MT5 to settle
          Start-Sleep -Seconds 10

      - name: Create MT5 Terminal INI
        shell: powershell
        run: |
          $iniPath = "trading_bot/terminal.ini"
          $iniContent = @"
          [Common]
          Login=$(($env:MT5_LOGIN))
          Password=$(($env:MT5_PASSWORD))
          Server=$(($env:MT5_SERVER))
          CertPassword=
          ProxyEnable=0
          ProxyType=0
          ProxyAddress=
          ProxyAuth=
          "@
          Set-Content -Path $iniPath -Value $iniContent
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}

      - name: Run Trading Bot
        shell: powershell
        run: |
          # Set PYTHONPATH to include the root directory
          $env:PYTHONPATH = "."
          python trading_bot/bot.py
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Extract Artifacts
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts/logs"
          New-Item -ItemType Directory -Force -Path "artifacts/snapshots"
          if (Test-Path "trading_bot/logs") {
            Copy-Item -Path "trading_bot/logs/*" -Destination "artifacts/logs" -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path "trading_bot/snapshots") {
            Copy-Item -Path "trading_bot/snapshots/*" -Destination "artifacts/snapshots" -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trading-artifacts-${{ github.run_id }}
          path: artifacts/

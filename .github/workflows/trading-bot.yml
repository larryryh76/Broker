name: Money Machine Linux Container Trading Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  trade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: mt5-trading-bot:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # Temp fix for cache-to issue
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Run Trading Cycle in Linux Container
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          docker run --rm \
            -e MT5_LOGIN="${MT5_LOGIN}" \
            -e MT5_PASSWORD="${MT5_PASSWORD}" \
            -e MT5_SERVER="${MT5_SERVER}" \
            -e MONGODB_URI="${MONGODB_URI}" \
            mt5-trading-bot:latest

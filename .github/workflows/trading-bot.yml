name: Autonomous AI Trading Machine

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *" # Every 4 hours for research & trade

jobs:
  trade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Persistent Cache for Wine & Models
      - name: Cache Persistent Data
        id: cache-persistent
        uses: actions/cache@v4
        with:
          path: |
            wine_prefix/
            mt5_terminal/
            trading-bot/models/
          key: ai-machine-persistent-v1-${{ runner.os }}

      - name: Build Machine Image
        run: |
          docker build -t ai-trading-machine .

      - name: Run Autonomous Cycle
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          mkdir -p wine_prefix mt5_terminal trading-bot/models
          chmod -R 777 wine_prefix mt5_terminal trading-bot/models

          docker run --rm \
            -e MT5_LOGIN="${MT5_LOGIN}" \
            -e MT5_PASSWORD="${MT5_PASSWORD}" \
            -e MT5_SERVER="${MT5_SERVER}" \
            -e MONGODB_URI="${MONGODB_URI}" \
            -v $(pwd)/wine_prefix:/app/.wine \
            -v $(pwd)/mt5_terminal:/app/.mt5 \
            -v $(pwd)/trading-bot/models:/app/trading-bot/models \
            ai-trading-machine:latest

      - name: Upload Research Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: machine-results-${{ github.run_id }}
          path: |
            trading-bot/logs/
            trading-bot/trades/
            trading-bot/data/

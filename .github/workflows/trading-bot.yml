name: Foundation MT5 Snapshot Cycle (Docker/mt5linux)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  foundation-cycle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # SECTION 12 — Manual MT5 Container Lifecycle
      - name: Start Combined Bot Container
        run: |
          docker run -d --name mt5 -p 8001:8001 \
            -e MT5_LOGIN="${{ secrets.MT5_LOGIN }}" \
            -e MT5_PASSWORD="${{ secrets.MT5_PASSWORD }}" \
            -e MT5_SERVER="${{ secrets.MT5_SERVER }}" \
            -e MONGODB_URI="${{ secrets.MONGODB_URI }}" \
            ghcr.io/larryryh76/broker-bot:latest

      - name: Verify Container Status
        run: docker ps -a

      - name: Wait for Container Health
        run: |
          echo "Checking container health..."
          for i in {1..20}; do
            if [ "$(docker inspect -f '{{.State.Running}}' mt5)" == "true" ]; then
              echo "Container is running."
              exit 0
            fi
            echo "Waiting for container..."
            sleep 5
          done
          echo "Container failed to start."
          exit 1

      - name: Wait for MT5 Initialized
        run: |
          echo "Waiting for MT5 terminal and bridge to stabilize..."
          # Since the bot is running inside the container, we just monitor logs or wait fixed time
          sleep 90
          docker logs mt5

      - name: Print Final Container Logs
        if: always()
        run: docker logs mt5 || true

      - name: Ensure logs directories exist (Local dummy for artifact compatibility)
        if: always()
        run: |
          mkdir -p trading-bot/logs
          mkdir -p trading-bot/snapshots

      # Note: Since the bot runs INSIDE the container,
      # we'd need to use 'docker cp' to get logs back to the host for uploading.
      - name: Extract Logs from Container
        if: always()
        run: |
          docker cp mt5:/app/trading-bot/logs/ trading-bot/ || true
          docker cp mt5:/app/trading-bot/snapshots/ trading-bot/ || true

      - name: Upload Logs and Snapshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-artifacts-${{ github.run_id }}
          path: |
            trading-bot/logs/
            trading-bot/snapshots/

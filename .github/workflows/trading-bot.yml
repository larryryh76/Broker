name: Autonomous MT5 Trading Cycle (Native Windows)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  trading-cycle:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r trading_bot/requirements.txt
          pip install MetaTrader5 psutil

      - name: Setup MT5 and Verification
        id: setup
        shell: powershell
        run: |
          # 1. Download PsExec
          $pstoolsUrl = "https://download.sysinternals.com/files/PSTools.zip"
          $pstoolsPath = "$env:TEMP\PSTools.zip"
          Invoke-WebRequest -Uri $pstoolsUrl -OutFile $pstoolsPath
          Expand-Archive -Path $pstoolsPath -DestinationPath "C:\pstools" -Force

          # 2. Download and Install MT5
          $setupUrl = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          $setupPath = "$env:TEMP\mt5setup.exe"
          $installPath = "C:\mt5_terminal"

          echo "Downloading MT5 Installer..."
          Invoke-WebRequest -Uri $setupUrl -OutFile $setupPath

          echo "Installing MT5 Terminal..."
          Start-Process -FilePath $setupPath -ArgumentList "/auto", "/path:$installPath" -Wait
          Start-Sleep -Seconds 15

          # 3. VERIFIED DISCOVERY (No Assumptions)
          $mt5Path = Get-ChildItem -Path "C:\" -Filter "terminal64.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName

          if (-not $mt5Path -or -not (Test-Path $mt5Path)) {
             Write-Error "MT5 executable NOT FOUND. stopping."
             exit 1
          }

          $mt5File = Get-Item $mt5Path
          $mt5Dir = Split-Path $mt5Path

          echo "MT5 VERIFIED:"
          echo "Path: $($mt5File.FullName)"
          echo "Size: $([math]::Round($mt5File.Length / 1MB, 2)) MB"
          echo "LastModified: $($mt5File.LastWriteTime)"

          # Ensure execution permissions
          Unblock-File -Path $mt5Path

          # Set for GHA environment
          echo "MT5_EXE=$mt5Path" >> $env:GITHUB_ENV
          echo "MT5_DIR=$mt5Dir" >> $env:GITHUB_ENV

          # 4. Seed Config for Automatic Login
          $configDir = "$mt5Dir\config"
          if (!(Test-Path $configDir)) { New-Item -ItemType Directory -Path $configDir }
          $commonIni = @"
          [Common]
          Login=$($env:MT5_LOGIN)
          Password=$($env:MT5_PASSWORD)
          Server=$($env:MT5_SERVER)
          ProxyEnable=0
          "@
          Set-Content -Path "$configDir\common.ini" -Value $commonIni
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}

      - name: Launch MT5 and Verify Process
        shell: powershell
        run: |
          $mt5Path = $env:MT5_EXE
          $mt5Dir = $env:MT5_DIR

          # 1. Activate Windows Explorer
          cmd /c "start explorer.exe"
          Start-Sleep -Seconds 5

          echo "Attempting SAFE launch of MetaTrader 5..."
          # Start-Process with explicit working directory
          Start-Process -FilePath $mt5Path -WorkingDirectory $mt5Dir -ArgumentList "/portable", "/skipupdate"

          Start-Sleep -Seconds 15

          # 2. VERIFY PROCESS EXISTS
          $proc = Get-Process terminal64 -ErrorAction SilentlyContinue
          if (-not $proc) {
             Write-Error "MT5 failed to launch even though file exists."
             exit 1
          }
          echo "MT5 RUNNING: PID $($proc.Id)"

          # 3. Now Use PsExec to ensure Session 1 attachment (If needed, but Start-Process was already verified)
          echo "Migrating to Interactive Session (PsExec)..."
          C:\pstools\psexec.exe /accepteula -i 1 -d "$mt5Path" /portable /skipupdate

          # 4. Final Stabilization Loop
          Add-Type -AssemblyName System.Windows.Forms
          for ($i=1; $i -le 6; $i++) {
            Start-Sleep -Seconds 15
            $check = Get-Process terminal64 -ErrorAction SilentlyContinue
            if ($check) {
              echo "Attempt ${i}: MT5 is STABLE (PID: $($check.Id))"
              [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
            } else {
              echo "Attempt ${i}: MT5 crashed. Relaunching..."
              C:\pstools\psexec.exe /accepteula -i 1 -d "$mt5Path" /portable /skipupdate
            }
          }
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}

      - name: Run Trading Bot
        shell: powershell
        run: |
          $env:PYTHONPATH = "."
          python trading_bot/bot.py
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MT5_TERMINAL_PATH: ${{ env.MT5_EXE }}

      - name: Extract Artifacts
        if: always()
        shell: powershell
        run: |
          if (!(Test-Path "artifacts")) { New-Item -ItemType Directory -Path "artifacts" }
          $mt5DataDir = "$env:MT5_DIR"
          if (Test-Path "$mt5DataDir\MQL5\Logs") {
             Copy-Item -Path "$mt5DataDir\MQL5\Logs\*" -Destination "artifacts/logs" -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path "trading_bot/logs") {
            Copy-Item -Path "trading_bot/logs/*" -Destination "artifacts/logs" -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path "trading_bot/snapshots") {
            Copy-Item -Path "trading_bot/snapshots" -Destination "artifacts/snapshots" -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trading-artifacts-${{ github.run_id }}
          path: artifacts/

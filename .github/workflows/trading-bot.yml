name: Money Machine Trading Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  trade:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Headless Display (Mesa3D)
        uses: pyvista/setup-headless-display-action@v3
        with:
          mesa3d-release: '24.3.0'

      # Install VNC for GUI IPC satisfaction
      - name: Install Virtual Desktop Dependencies
        run: |
          choco install tightvnc -y

      # Environment Setup
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Cache MT5 Terminal
        id: cache-mt5
        uses: actions/cache@v4
        with:
          path: mt5_terminal
          key: mt5-terminal-v1

      - name: Download and Install MT5 (if not cached)
        if: steps.cache-mt5.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $dir = "$env:GITHUB_WORKSPACE\mt5_terminal"
          if (!(Test-Path $dir)) { New-Item -ItemType Directory -Force -Path $dir }
          $url = "https://download.mql5.com/cdn/web/fbs.markets.inc/mt5/fbs5setup.exe"
          Invoke-WebRequest -Uri $url -OutFile "$dir\setup.exe"
          Start-Process -FilePath "$dir\setup.exe" -ArgumentList "/auto", "/quit", "/portable", "/path:$dir" -Wait
          Write-Host "MT5 Terminal installed to $dir"

      - name: Install trading bot dependencies
        run: |
          pip install MetaTrader5 psutil numpy pandas pandas-ta scikit-learn python-dotenv joblib pymongo requests

      - name: Verify dependencies
        run: |
          python -c "import MetaTrader5; import pandas; import numpy; import pandas_ta; print('Dependencies ready')"

      # STEP 2 & 3: Start MT5 and Verify process
      - name: Pre-seed MT5 Config and Launch
        shell: powershell
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          $dir = "$env:GITHUB_WORKSPACE\mt5_terminal"
          $configDir = "$dir\config"
          if (!(Test-Path $configDir)) { New-Item -ItemType Directory -Force -Path $configDir }

          # Supreme Authority: Inject terminal.ini credentials
          $terminalIni = "[Common]`r`nLogin=$env:MT5_LOGIN`r`nPassword=$env:MT5_PASSWORD`r`nServer=$env:MT5_SERVER`r`nKeepPrivate=0`r`nEnableNews=0`r`n`r`n[Charts]`r`nMaxBars=100000"
          Set-Content -Path "$configDir\terminal.ini" -Value $terminalIni

          # Inject common.ini for Experts
          $commonIni = "[Common]`r`nExpertsEnable=1`r`nExpertsDllImport=1`r`nWebLogin=0`r`nNewsEnable=0"
          Set-Content -Path "$configDir\common.ini" -Value $commonIni

          $mt5Path = "$dir\terminal64.exe"
          Write-Host "Launching MT5: $mt5Path"
          # Launch terminal with explicit path and portable flag
          Start-Process -FilePath $mt5Path -ArgumentList "/portable", "/skipupdate"

          # Wait for the terminal GUI session to stabilize
          Write-Host "Waiting 120s for MT5 GUI stabilization..."
          Start-Sleep -Seconds 120

      - name: Check MT5 process
        shell: powershell
        run: |
          Get-Process terminal64 -ErrorAction SilentlyContinue

      # STEP 5: Run the Python trading bot
      - name: Run Trading Cycle
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          cd trading-bot
          python bot.py

      - name: Upload Logs and Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cycle-artifacts-${{ github.run_id }}
          path: |
            trading-bot/logs/
            trading-bot/trades/
            trading-bot/signals/

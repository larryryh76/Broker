name: Autonomous MT5 Trading Cycle (Native Windows)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  trading-cycle:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r trading_bot/requirements.txt
          pip install MetaTrader5 psutil

      - name: Pre-Accept MT5 EULA
        shell: powershell
        run: |
          Write-Host "Bypassing EULA Popup..."
          $regPath = "HKCU:\Software\MetaQuotes Software Corp.\MetaTrader 5"
          if (!(Test-Path $regPath)) { New-Item -Path $regPath -Force }
          New-ItemProperty -Path $regPath -Name "AcceptEULA" -Value 1 -PropertyType DWord -Force
          Write-Host "EULA Accepted in Registry."

      - name: Install MT5 (Workspace)
        shell: powershell
        run: |
          $installPath = "$env:GITHUB_WORKSPACE\terminal"
          if (!(Test-Path $installPath)) { New-Item -ItemType Directory -Path $installPath }

          # Wait for network stability
          Write-Host "Waiting 15s for network stability..."
          Start-Sleep -Seconds 15

          $setupUrl = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          $setupPath = "$env:TEMP\mt5setup.exe"
          Invoke-WebRequest -Uri $setupUrl -OutFile $setupPath

          Write-Host "Installing MT5 Terminal to $installPath..."
          Start-Process -FilePath $setupPath -ArgumentList "/auto", "/path:$installPath" -Wait
          Start-Sleep -Seconds 10

          $mt5Path = "$installPath\terminal64.exe"
          if (!(Test-Path $mt5Path)) {
            Write-Error "MT5 installation failed: terminal64.exe not found."
            exit 1
          }
          Unblock-File -Path $mt5Path

      - name: Pre-Launch MT5 (Bulletproof)
        shell: powershell
        run: |
          pwsh -ExecutionPolicy Bypass -File trading_bot/pre_launch.ps1
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}

      - name: Run Trading Bot
        shell: powershell
        run: |
          $env:PYTHONPATH = "."
          python trading_bot/bot.py
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MT5_TERMINAL_PATH: "${{ github.workspace }}\\terminal\\terminal64.exe"

      - name: Extract Artifacts
        if: always()
        shell: powershell
        run: |
          if (!(Test-Path "artifacts")) { New-Item -ItemType Directory -Path "artifacts" }
          $mt5Dir = "$env:GITHUB_WORKSPACE\terminal"
          if (Test-Path "$mt5Dir\MQL5\Logs") {
             Copy-Item -Path "$mt5Dir\MQL5\Logs\*" -Destination "artifacts/logs" -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path "trading_bot/logs") {
            Copy-Item -Path "trading_bot/logs/*" -Destination "artifacts/logs" -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path "trading_bot/snapshots") {
            Copy-Item -Path "trading_bot/snapshots" -Destination "artifacts/snapshots" -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trading-artifacts-${{ github.run_id }}
          path: artifacts/

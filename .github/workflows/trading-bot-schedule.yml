name: The Money Machine Trading Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  trade:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download and Deploy Portable MT5
        shell: powershell
        run: |
          # Download the installer
          curl.exe -L -o setup.exe "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          # Extract it to the terminal folder
          Start-Process -FilePath ".\setup.exe" -ArgumentList "/auto", "/quit", "/portable", "/path:D:\a\Broker\Broker\mt5_terminal" -Wait
          # Check if it worked
          if (Test-Path "D:\a\Broker\Broker\mt5_terminal\terminal64.exe") { echo "SUCCESS: Terminal found!" } else { echo "ERROR: Terminal still missing" }

      - name: Pre-Configure Exness Servers
        shell: powershell
        run: |
          $configDir = "D:\a\Broker\Broker\mt5_terminal\config"
          if (!(Test-Path $configDir)) { mkdir $configDir }
          # Create a basic common.ini that allows auto-trading and bypasses popups
          $iniContent = "[Common]`r`nLogin=$($env:MT5_LOGIN)`r`nServer=$($env:MT5_SERVER)`r`nProxyEnable=0`r`nCertConfirm=1`r`nNewsEnable=0`r`nSoundEnable=0`r`n"
          Set-Content -Path "$configDir\common.ini" -Value $iniContent
          Write-Host "Common.ini created to bypass setup screens."

      - name: Force-Kill Stuck Processes
        shell: cmd
        run: taskkill /F /IM terminal64.exe /T 2>nul || echo No old processes found.

      - name: Run Trading Bot
        shell: cmd
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: python main.py

name: The Money Machine Trading Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  trade:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install MetaTrader 5
        timeout-minutes: 10
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/exness.technologies.ltd/mt5/exness5setup.exe" -OutFile "mt5setup.exe"
          $process = Start-Process -FilePath ".\mt5setup.exe" -ArgumentList "/auto", "/quit" -PassThru -Wait
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue

          # Search for terminal64.exe and print path
          $mt5path = Get-ChildItem -Path "C:\","C:\Users\runneradmin\AppData\Local" -Filter "terminal64.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName -First 1
          Write-Host "Found MT5 at: $mt5path"

          # Ensure config dir exists where terminal is
          if ($mt5path) {
              $configDir = Join-Path (Split-Path $mt5path) "config"
              New-Item -ItemType Directory -Force -Path $configDir
              New-Item -ItemType File -Force -Path (Join-Path $configDir "common.ini") -Value "[Common]`nLogin=$($env:MT5_LOGIN)`nServer=$($env:MT5_SERVER)"
          }

      - name: Run Trading Bot
        shell: cmd
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: python main.py

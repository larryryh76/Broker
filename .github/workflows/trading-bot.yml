name: Foundation MT5 Snapshot Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *" # Trigger every 15 minutes

jobs:
  foundation-cycle:
    runs-on: windows-latest # Stable native foundation

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install MetaTrader5 pandas pymongo python-dotenv psutil

      - name: Setup Headless Display (Mesa3D)
        uses: pyvista/setup-headless-display-action@v3
        with:
          mesa3d-release: '24.3.0'

      - name: Cache MT5 Terminal
        id: cache-mt5
        uses: actions/cache@v4
        with:
          path: mt5_terminal
          key: mt5-terminal-v4

      - name: Download and Install MT5 (if not cached)
        if: steps.cache-mt5.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $dir = "$env:GITHUB_WORKSPACE\mt5_terminal"
          if (!(Test-Path $dir)) { New-Item -ItemType Directory -Force -Path $dir }
          # Using FBS installer as a standard broker-native stable base
          $url = "https://download.mql5.com/cdn/web/fbs.markets.inc/mt5/fbs5setup.exe"
          Invoke-WebRequest -Uri $url -OutFile "$dir\setup.exe"
          Start-Process -FilePath "$dir\setup.exe" -ArgumentList "/auto", "/quit", "/portable", "/path:$dir" -Wait
          Write-Host "MT5 Terminal installed to $dir"

      - name: Pre-seed Headless Config
        shell: powershell
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          $dir = "$env:GITHUB_WORKSPACE\mt5_terminal\config"
          if (!(Test-Path $dir)) { New-Item -ItemType Directory -Force -Path $dir }

          # Inject common.ini for Experts/Algo-trading
          $commonIni = "[Common]`r`nExpertsEnable=1`r`nExpertsDllImport=1`r`nWebLogin=0`r`nNewsEnable=0"
          Set-Content -Path "$dir\common.ini" -Value $commonIni

          # Inject terminal.ini for login bypass
          $terminalIni = "[Common]`r`nLogin=$env:MT5_LOGIN`r`nPassword=$env:MT5_PASSWORD`r`nServer=$env:MT5_SERVER`r`nKeepPrivate=0`r`nEnableNews=0`r`n`r`n[Charts]`r`nMaxBars=100000"
          Set-Content -Path "$dir\terminal.ini" -Value $terminalIni

      # SECTION 10 — Start MT5 Terminal before Python (to avoid IPC timeout)
      - name: Start MT5 Terminal
        shell: powershell
        run: |
          $mt5Path = "$env:GITHUB_WORKSPACE\mt5_terminal\terminal64.exe"
          Write-Host "Starting MT5 from $mt5Path"
          # Launch in portable mode with config pre-seeded
          Start-Process -FilePath $mt5Path -ArgumentList "/portable", "/skipupdate"
          # Wait longer for stabilizer (120s)
          Write-Host "Waiting 120s for MT5 to stabilize..."
          Start-Sleep -Seconds 120

      - name: Run Foundation Cycle
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          cd trading-bot
          python bot.py

      # SECTION 11 — Kill MT5 process (to release file locks for caching)
      - name: Cleanup MT5 Process
        if: always()
        shell: powershell
        run: |
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "MT5 Terminal process terminated."

      - name: Upload Logs and Snapshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-artifacts-${{ github.run_id }}
          path: |
            trading-bot/logs/
            trading-bot/snapshots/

name: Foundation MT5 Snapshot Cycle (Docker/mt5linux)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  foundation-cycle:
    runs-on: ubuntu-latest

    services:
      # SECTION 12 — Custom MT5 Headless Environment
      mt5:
        image: ghcr.io/${{ github.repository_owner }}/mt5-headless:latest
        ports:
          - 8001:8001
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r trading-bot/requirements.txt
          python -m pip list

      - name: Wait for MT5 Bridge
        run: |
          echo "Waiting for MT5 bridge (RPyC) to initialize..."
          for i in {1..30}; do
            if nc -z localhost 8001; then
              echo "Bridge port 8001 is open!"
              echo "Stabilizing for 60 seconds to ensure MT5 terminal is ready..."
              sleep 60
              exit 0
            fi
            echo "Waiting..."
            sleep 10
          done
          echo "Bridge failed to start."
          exit 1

      - name: Run Foundation Cycle
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          cd trading-bot
          python bot.py

      - name: Upload Logs and Snapshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-artifacts-${{ github.run_id }}
          path: |
            trading-bot/logs/
            trading-bot/snapshots/

name: The Money Machine Trading Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  trade:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Virtual Display & Config
        shell: powershell
        run: |
          # Ensure config dir exists in local repo folder
          New-Item -ItemType Directory -Force -Path "mt5_terminal\config"
          New-Item -ItemType File -Force -Path "mt5_terminal\config\common.ini" -Value "[Common]`nLogin=$($env:MT5_LOGIN)`nServer=$($env:MT5_SERVER)"

      - name: Run Trading Bot
        shell: cmd
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: python main.py
